{% extends "base.html" %}
{% block content %}

<h2>{{ t('report_title') }}</h2>

<p>{{ t('report_body') }}</p>

<form method="post" action="{{ base_path }}/report">
  <p>
    <label for="report-reason">{{ t('lbl_reason') }}</label><br>
    <select id="report-reason" name="reason">
      {% for r in reasons %}<option value="{{ r }}">{{ t('reason_' + r) }}</option>{% endfor %}
    </select>
  </p>
  <p>
    <label for="report-detail">{{ t('lbl_detail') }}</label><br>
    <textarea id="report-detail" name="detail" rows="4" style="width:100%; font:inherit"
       placeholder="{{ t('report_detail_ph') }}"></textarea>
  </p>
  <button type="submit">{{ t('btn_report') }}</button>
</form>

{% endblock %}
